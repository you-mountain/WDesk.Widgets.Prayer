name: Release Widget

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Prepare package
        shell: pwsh
        run: |
          $buildDir = "bin\Release\net8.0-windows10.0.19041.0"
          $packageDir = "package"

          if (Test-Path $packageDir) { Remove-Item $packageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $packageDir | Out-Null

          Copy-Item "manifest.json" $packageDir

          $mainDll = Join-Path $buildDir "WDesk.Widgets.Prayer.dll"
          Copy-Item $mainDll $packageDir

          $pdbFile = Join-Path $buildDir "WDesk.Widgets.Prayer.pdb"
          if (Test-Path $pdbFile) { Copy-Item $pdbFile $packageDir }

          if (Test-Path "Resources") {
              Copy-Item "Resources" $packageDir -Recurse
          }

          Compress-Archive -Path "$packageDir\*" -DestinationPath "prayer.zip"

          $hash = (Get-FileHash "prayer.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "prayer.zip").Length

          Write-Host "SHA256: $hash"
          Write-Host "Size:   $size bytes"

          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get version
        shell: pwsh
        run: |
          $manifest = Get-Content "manifest.json" | ConvertFrom-Json
          $version = $manifest.version
          Write-Host "Version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "Prayer Times v${{ env.VERSION }}"
          body: |
            ## Prayer Times v${{ env.VERSION }}

            Automated release.

            - **SHA256:** `${{ env.SHA256 }}`
            - **Size:** ${{ env.SIZE }} bytes
          files: prayer.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}